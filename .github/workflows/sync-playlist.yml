name: Sync playlist

# Runs whenever audio lands in songs/ (from your PC, or by uploading a file
# straight from the GitHub web UI / mobile app). It adds the missing playlist
# entries, downloads the matching cover art from the iTunes Store, and commits
# the result back to the repo.
on:
  push:
    branches: [main]
    paths:
      - "songs/**"
      - "tools/sync-playlist.mjs"
      - ".github/workflows/sync-playlist.yml"
  workflow_dispatch:

permissions:
  contents: write

# Don't stack runs on top of each other.
concurrency:
  group: sync-playlist
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Reconcile songs.js with songs/
        run: node tools/sync-playlist.mjs

      - name: Commit any playlist changes
        run: |
          if git diff --quiet -- songs.js covers/; then
            echo "Playlist already up to date - nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add songs.js covers/
          # [skip ci] stops this commit from re-triggering this workflow.
          git commit -m "chore: sync playlist from songs/ [skip ci]"
          git push
